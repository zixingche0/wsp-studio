[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsp-studio"
version = "0.1.0"
description = "Weight-space programming studio: edit small local model weights by talking to an LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WSP Studio contributors" }]
keywords = [
    "weight-space-programming",
    "model-editing",
    "llm",
    "interpretability",
    "safetensors",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# 核心引擎只用 numpy。torch / transformers 是可选依赖，
# 只有"跑模型推理"（探测、评估）时才需要。
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
    "jsonschema>=4",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
model = [
    "torch>=2.2",
    "transformers>=4.40",
    "safetensors>=0.4",
]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
]
all = ["wsp-studio[model,dev]"]

[project.urls]
Homepage = "https://github.com/wsp-studio/wsp-studio"
Repository = "https://github.com/wsp-studio/wsp-studio"
Issues = "https://github.com/wsp-studio/wsp-studio/issues"
Changelog = "https://github.com/wsp-studio/wsp-studio/blob/main/CHANGELOG.md"

[project.scripts]
wsp = "wsp.cli:main"

[tool.setuptools.packages.find]
include = ["wsp*"]

[tool.setuptools.package-data]
"wsp.web" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: requires a real model on disk (skip by default)",
]
